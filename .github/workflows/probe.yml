name: Probe
on:
  push:
    branches: [claude/overlay-win-probe]
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - shell: cmd
        run: node_modules\electron\dist\electron.exe probe\overlay-win.js
