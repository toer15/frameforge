name: Probe
on:
  push:
    branches: [claude/limiter-probe]
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node probe/limiter.js
