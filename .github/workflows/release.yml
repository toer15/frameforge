# Builds FrameForge on a real Windows machine and publishes it as a GitHub Release.
# Every copy of FrameForge checks this repo's releases and shows the update popup.
#
# To release a new version:  git tag v1.1.0  &&  git push origin v1.1.0
# Then edit the release on GitHub to write "what's new" — that text appears in the popup.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set app version from the tag
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - run: npm ci

      - name: Build installer and publish release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Publishes to the repo in package.json (toer15/frameforge). release-notes.md becomes the text on
        # the release page and in the in-app update popup.
        run: npx electron-builder --win nsis --x64 --publish always -c.releaseInfo.releaseNotesFile=release-notes.md
