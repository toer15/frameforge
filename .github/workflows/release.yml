# Builds FrameForge on a real Windows machine and publishes it as a GitHub Release.
# Every installed copy of FrameForge checks this repo's releases and shows the update popup.
#
# To release a new version: raise "version" in package.json, write what's new in release-notes.md,
# and push to main. If that version hasn't been released yet, this builds and publishes it.
# (It can also be started by hand from the Actions tab.)
name: Release

on:
  push:
    branches: [main]
    paths: ['package.json']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Skip if this version is already released
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v=$(node -p "require('./package.json').version")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v$v is already released — nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.check.outputs.skip != 'true'
        with:
          node-version: 20
          cache: npm

      - run: npm ci
        if: steps.check.outputs.skip != 'true'

      - name: Build installer and publish release
        if: steps.check.outputs.skip != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Publishes to the repo in package.json (toer15/frameforge). release-notes.md becomes the text on
        # the release page and in the in-app update popup.
        run: npx electron-builder --win nsis --x64 --publish always -c.releaseInfo.releaseNotesFile=release-notes.md
