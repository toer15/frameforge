# Runs the tests on a real Windows machine for every branch and pull request, before anything is released.
# (Releases are built by release.yml when the version in package.json changes on main.)
name: Test

on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22 # the demo-window tests use the WebSocket built into Node 22
          cache: npm
      - run: npm ci

      # Must pass: these cover what changes Windows itself.
      - name: Game Booster on real Windows, Fix Mode recovery, sensors
        run: node --test tests/booster.test.js tests/frameplan.test.js tests/bgfix.test.js tests/gamewatch.test.js tests/overlay.test.js tests/sensors-extra.test.js tests/fix-recovery.test.js tests/sensors-performance.test.js

      # The whole suite, including the demo-window tests. Shown for information; some need a desktop session.
      - name: Everything else
        continue-on-error: true
        run: node --test --test-concurrency=1
