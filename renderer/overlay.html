<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self' 'unsafe-inline'" />
  <link rel="stylesheet" href="../node_modules/@fontsource/orbitron/700.css" />
  <link rel="stylesheet" href="../node_modules/@fontsource/rajdhani/700.css" />
  <link rel="stylesheet" href="overlay.css" />
  <style>
    html, body { margin: 0; background: transparent; overflow: hidden; }
    /* Sized by its content alone (never by the window), so the window can be made to fit it exactly. */
    #wrap { position: absolute; left: 0; top: 0; width: max-content; }
  </style>
</head>
<body>
  <div id="wrap"></div>
  <script src="overlay-core.js"></script>
  <script>
    // Draws whatever renderer/overlay-core.js returns for the latest readings and the user's overlay settings,
    // then tells the main process how big that is so the (click-through) window fits it exactly.
    const wrap = document.getElementById('wrap');
    const state = FFOverlay.createState();
    let cfg = {};
    let last = null;
    let drawn = '';
    let sized = '';
    function draw() {
      const h = last ? FFOverlay.html(last, cfg, state) : '';
      if (h !== drawn) {
        wrap.innerHTML = h;
        drawn = h;
      }
      const r = wrap.getBoundingClientRect();
      const size = `${Math.ceil(r.width)}x${Math.ceil(r.height)}`;
      if (size !== sized) {
        sized = size;
        window.ff.overlaySize(Math.ceil(r.width), Math.ceil(r.height));
      }
    }
    window.ff.onStats((s) => {
      last = s;
      FFOverlay.push(state, s);
      draw();
    });
    // Update the live FPS number more often while keeping the one-minute graph at 1 Hz.
    window.ff.onFps((fps) => {
      if (!last) return;
      last = { ...last, ...fps };
      FFOverlay.pushStability(state, last);
      draw();
    });
    window.ff.onOverlayConfig((s) => {
      cfg = s || {};
      draw();
    });
    // Fonts arrive a moment after the first drawing and change its width.
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { sized = ''; draw(); });
  </script>
</body>
</html>
